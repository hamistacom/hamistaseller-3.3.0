[package]
name = "hamista-seller"
version = "3.3.0"
edition = "2021"
description = "هامیستا سلر — سامانه استخراج اطلاعات مشتریان و کسب‌وکارها"
authors = ["Hamista Creative Agency <hamista.ir>"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"] # release builds: UI served from inside the exe (cargo tauri build turns it on)
master = [] # your full copy, no licence         →  cargo tauri build --features master
issuer = [] # admin panel: licences, customers, server  →  cargo tauri build --features issuer
admin = ["issuer"] # same as issuer (clearer name)

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("testkey", "test-seams"))'] } # tests-harness only

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures = "0.3"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
reqwest = { version = "0.12", features = ["json"] } # default TLS = Windows SChannel, no extra build tools
rust_xlsxwriter = "0.79"
calamine = "0.26"
encoding_rs = "0.8" # Persian-Windows CSV (Windows-1256)
tauri-plugin-notification = "2"

[profile.release]
opt-level = 3
lto = false # prevents linker freeze at 545/546 on Windows while keeping full runtime speed
codegen-units = 16
strip = true
panic = "unwind" # required by catch_unwind() in commands.rs so a task panic never kills the app
