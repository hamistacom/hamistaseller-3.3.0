<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>هامیستا سلر</title>
  <link rel="icon" href="brand/icon.png">
  <link rel="preload" href="fonts/YekanBakh-VF.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="side">
      <div class="brand">
        <img src="brand/icon.png" alt="">
        <div><b>هامیستا سلر</b><span id="brand-sub">بانک اطلاعات مشتریان</span></div>
      </div>
      <div class="spaces" id="spaces" role="tablist" aria-label="بخش‌های برنامه"></div>
      <label class="search" id="search-box">
        <span class="icon sm" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input id="search" placeholder="جستجوی مخاطب…" autocomplete="off">
      </label>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="jobcard" id="jobcard" hidden></div>
        <div class="insight" id="insight" hidden></div>
        <div class="side-links">
          <button type="button" class="lic-chip" id="lic-chip" hidden></button>
          <span class="row tight-row">
            <button class="btn ghost sm lang-btn" id="lang" type="button" aria-label="زبان برنامه"></button>
            <button class="btn ghost sm icon-only" id="theme" type="button" aria-label="حالت روشن / تیره"></button>
          </span>
        </div>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <div class="titles"><h1 id="page-title"></h1><p id="page-sub"></p></div>
        <div id="page-actions" class="row"></div>
        <button class="btn ghost icon-only help-btn" id="help-btn" type="button" aria-label="راهنمای این صفحه" title="راهنمای این صفحه" hidden></button>
        <div class="user-pill" id="user-pill">
          <button class="btn ghost icon-only bell" id="bell" type="button" aria-label="اعلان‌ها" hidden></button>
          <span class="avatar user-av" id="user-av" aria-hidden="true">ه</span>
          <span class="who"><b id="user-name">هامیستا سلر</b><span id="user-sub"></span></span>
        </div>
      </header>
      <div id="banner"></div>
      <div id="banner-ver"></div>
      <section class="view" id="view"></section>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
