# Builds the three Windows editions on every push to main and every pull request (and by hand from
# the Actions tab).
# A tag like v3.1.0 also publishes them as a GitHub Release.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: # compile-check every PR on Windows (the only platform the app builds for)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build customer, master and admin
        shell: cmd
        run: build-all.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: HamistaSeller-exes
          path: bin/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.exe
